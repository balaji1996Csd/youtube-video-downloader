<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shorts Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080810;--surface:#0f0f1a;--card:#13131f;--card-hover:#181828;
  --border:#1e1e30;--border2:#2a2a40;
  --red:#ff2d55;--red-glow:rgba(255,45,85,0.25);
  --green:#00e676;--green-dim:rgba(0,230,118,0.12);
  --blue:#0a84ff;--yellow:#ffd60a;
  --text:#eeeef5;--sub:#8888aa;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,8,16,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:1rem;padding:0 1.5rem;height:58px;
}
.logo{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.logo-box{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(135deg,var(--red),#ff6b35);
  display:grid;place-items:center;font-size:13px;
  box-shadow:0 0 16px rgba(255,45,85,0.4);
}
.hstats{display:flex;gap:1.2rem;margin-left:auto}
.hstat{font-family:var(--mono);font-size:.7rem;color:var(--sub)}
.hstat b{color:var(--text);font-weight:500}
.hbtn{
  padding:7px 14px;border-radius:7px;border:1px solid var(--border2);
  background:var(--surface);color:var(--text);
  font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:600;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.hbtn:hover{background:var(--card-hover);border-color:#3a3a55}

/* MAIN */
.main{max-width:1440px;margin:0 auto;padding:1.5rem}

/* DROP ZONE */
.drop{
  border:2px dashed var(--border2);border-radius:16px;
  padding:2.5rem 2rem;text-align:center;cursor:pointer;
  background:var(--surface);margin-bottom:1.5rem;
  transition:all .2s;position:relative;overflow:hidden;
}
.drop::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% -20%,rgba(255,45,85,.06),transparent 65%);
  pointer-events:none;
}
.drop:hover,.drop.over{border-color:var(--red);background:rgba(255,45,85,.03)}
.drop-icon{font-size:2.2rem;margin-bottom:.8rem}
.drop h2{font-size:1rem;font-weight:700;margin-bottom:.3rem}
.drop p{color:var(--sub);font-size:.82rem;line-height:1.6}
.drop code{
  font-family:var(--mono);color:#ff9f43;
  background:rgba(255,159,67,.1);padding:1px 6px;border-radius:4px;font-size:.76rem;
}

/* CHANNEL BAR */
.ch-bar{
  display:none;align-items:center;gap:10px;
  padding:10px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:11px;margin-bottom:1.2rem;
}
.ch-bar.on{display:flex}
.ch-name{font-weight:700;font-size:.9rem}
.ch-meta{color:var(--sub);font-family:var(--mono);font-size:.72rem}

/* PROGRESS BAR */
.prog-wrap{
  display:none;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:12px 16px;margin-bottom:1.2rem;
  align-items:center;gap:1rem;flex-wrap:wrap;
}
.prog-wrap.on{display:flex}
.prog-track{flex:1;min-width:100px;height:6px;background:var(--border2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#00c853);border-radius:99px;transition:width .4s ease}
.prog-lbl{font-family:var(--mono);font-size:.72rem;color:var(--sub);white-space:nowrap}
.prog-lbl b{color:var(--green)}

/* CONTROLS */
.controls{display:none;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.2rem}
.controls.on{display:flex}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:0 12px;height:40px;transition:border-color .2s;
}
.search:focus-within{border-color:var(--red)}
.search input{
  background:none;border:none;outline:none;color:var(--text);
  font-family:'Outfit',sans-serif;font-size:.85rem;width:100%;
}
.search input::placeholder{color:var(--sub)}
.filters{display:flex;gap:5px}
.fb{
  padding:7px 13px;border-radius:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--sub);
  font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.fb:hover{color:var(--text);border-color:var(--border2)}
.fb.on{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 2px 12px var(--red-glow)}
.bulk-btn{
  padding:8px 14px;border-radius:8px;border:none;
  background:rgba(255,45,85,.12);color:var(--red);border:1px solid rgba(255,45,85,.25);
  font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.bulk-btn:hover{background:rgba(255,45,85,.2)}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(178px,1fr));
  gap:12px;
}

/* CARD */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:13px;overflow:hidden;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.5);border-color:var(--border2)}
.card.done{opacity:.5}
.card.done:hover{opacity:.7}
.card.going{border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,132,255,.2)}

/* Thumb */
.thumb{position:relative;aspect-ratio:9/16;background:#0a0a14;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
.card:hover .thumb img{transform:scale(1.05)}
.dur{
  position:absolute;bottom:7px;right:7px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  color:#fff;font-family:var(--mono);font-size:.62rem;
  padding:2px 6px;border-radius:4px;
}
/* Done overlay */
.done-ov{
  position:absolute;inset:0;
  background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.card.done .done-ov{opacity:1}
.done-badge{
  background:var(--green);color:#000;
  font-size:.65rem;font-weight:800;
  padding:4px 10px;border-radius:6px;letter-spacing:.5px;
}
/* Progress ring */
.ring-wrap{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:4px;
  background:rgba(8,8,16,.65);backdrop-filter:blur(3px);
}
.card.going .ring-wrap{display:flex}
.ring{width:48px;height:48px}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.1)}
.ring .pr{
  stroke:var(--blue);stroke-dasharray:126;stroke-dashoffset:126;
  transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s;
}
.ring-pct{color:#fff;font-family:var(--mono);font-size:.68rem}

/* Card body */
.cbody{padding:9px 11px 11px;flex:1;display:flex;flex-direction:column;gap:6px}
.ctitle{
  font-size:.78rem;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.cmeta{font-family:var(--mono);font-size:.65rem;color:var(--sub);display:flex;align-items:center;gap:5px}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sd-grey{background:var(--sub)} .sd-green{background:var(--green)} .sd-blue{background:var(--blue)}

/* Download button */
.dl-btn{
  margin-top:auto;width:100%;padding:8px;border-radius:8px;border:none;
  font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.dl-btn.ready{
  background:linear-gradient(135deg,var(--red),#d01440);color:#fff;
  box-shadow:0 3px 14px var(--red-glow);
}
.dl-btn.ready:hover{transform:translateY(-1px);box-shadow:0 5px 20px rgba(255,45,85,.45)}
.dl-btn.ready:active{transform:translateY(0)}
.dl-btn.going-btn{background:rgba(10,132,255,.12);color:var(--blue);border:1px solid rgba(10,132,255,.25);cursor:not-allowed}
.dl-btn.done-btn{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,.2);cursor:default}

/* Empty */
.empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--sub)}
.empty .ei{font-size:2.8rem;margin-bottom:.8rem;opacity:.35}

/* Modal */
.modal-bg{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
.modal{
  background:#13131f;border:1px solid #2a2a40;
  border-radius:16px;padding:1.8rem;max-width:420px;width:100%;
  font-family:'Outfit',sans-serif;
}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.modal p{color:#8888aa;font-size:.82rem;line-height:1.6;margin-bottom:1rem}
.modal-actions{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.2rem}
.ma-link{
  display:block;padding:10px 14px;border-radius:8px;text-decoration:none;
  font-weight:700;font-size:.82rem;text-align:center;
}
.ma-primary{
  background:linear-gradient(135deg,var(--red),#e0163d);color:#fff;
  box-shadow:0 3px 14px rgba(255,45,85,.35);
}
.ma-secondary{
  background:#1e1e30;color:#eeeef5;border:1px solid #2a2a40;
}
.modal-btns{display:flex;gap:.6rem}
.mbtn{
  padding:9px;border-radius:8px;border:none;cursor:pointer;
  font-family:'Outfit',sans-serif;font-weight:700;font-size:.8rem;flex:1;
}
.mbtn-green{background:var(--green-dim);color:var(--green)}
.mbtn-cancel{background:none;color:#8888aa;border:1px solid #2a2a40}

/* Toast */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:9998;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:10px;padding:10px 16px;
  font-size:.82rem;font-weight:600;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:8px;
  transform:translateY(70px);opacity:0;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

@media(max-width:560px){
  .hstats{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-box">▶</div>
    Shorts Manager
  </div>
  <div class="hstats">
    <div class="hstat">Total <b id="sTotal">—</b></div>
    <div class="hstat">Downloaded <b id="sDone" style="color:var(--green)">—</b></div>
    <div class="hstat">Pending <b id="sPend">—</b></div>
  </div>
  <button class="hbtn" id="saveBtn" style="display:none" onclick="saveProgress()">💾 Save Progress</button>
</header>

<div class="main">

  <!-- Drop zone -->
  <div class="drop" id="drop" onclick="document.getElementById('fi').click()">
    <input type="file" id="fi" accept=".json" style="display:none" onchange="onFilePick(event)"/>
    <div class="drop-icon">📂</div>
    <h2>Load your shorts_list.json</h2>
    <p>Click or drag &amp; drop the JSON file generated by <code>fetch_shorts.py</code></p>
    <p style="margin-top:10px;color:#252535;font-size:.76rem">
      Run first: <code>python3 fetch_shorts.py --channel https://www.youtube.com/@YourChannel</code>
    </p>
  </div>

  <!-- Channel bar -->
  <div class="ch-bar" id="chBar">
    <span style="font-size:1.1rem">📺</span>
    <div>
      <div class="ch-name" id="chName">—</div>
      <div class="ch-meta" id="chMeta">—</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="bulk-btn" onclick="downloadAllPending()">⬇ Download All Pending</button>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="prog-wrap" id="progWrap">
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-lbl" id="progLbl"><b>0</b> / 0 downloaded</div>
  </div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <div class="search">
      <span style="color:var(--sub)">🔍</span>
      <input type="text" id="searchQ" placeholder="Search shorts…" oninput="render()"/>
    </div>
    <div class="filters">
      <button class="fb on" onclick="setF(this,'all')">All</button>
      <button class="fb"    onclick="setF(this,'pending')">Pending</button>
      <button class="fb"    onclick="setF(this,'done')">Downloaded</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid">
    <div class="empty">
      <div class="ei">🎬</div>
      <p>Load shorts_list.json to see your videos</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── STATE ── */
let videos  = [];
let filter  = 'all';
let chData  = null;
const dlState = {}; // id -> 'idle'|'going'|'done'

/* ── FILE LOAD ── */
const drop = document.getElementById('drop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{
  e.preventDefault();drop.classList.remove('over');
  const f=e.dataTransfer.files[0];if(f)readJSON(f);
});
function onFilePick(e){const f=e.target.files[0];if(f)readJSON(f);}

function readJSON(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      loadParsedData(d);
      toast('✅ Loaded '+videos.length+' shorts');
    }catch{toast('❌ Invalid JSON file');}
  };
  r.readAsText(file);
}

function loadParsedData(d){
  chData=d; videos=(d.videos||[]).map(v=>({...v}));
  videos.forEach(v=>{ dlState[v.id]=v.downloaded?'done':'idle'; });
  initUI(d);
}

// Auto-load shorts_list.json if running from HTTP/HTTPS server
if(window.location.protocol.startsWith('http')){
  fetch('shorts_list.json')
    .then(r=>{ if(r.ok) return r.json(); throw new Error('Not found'); })
    .then(d=>{
      loadParsedData(d);
      toast('✅ Auto-loaded '+videos.length+' shorts');
    })
    .catch(()=>{ /* Fallback to dropzone */ });
}

function initUI(d){
  document.getElementById('drop').style.display='none';
  document.getElementById('controls').classList.add('on');
  document.getElementById('chBar').classList.add('on');
  document.getElementById('progWrap').classList.add('on');
  document.getElementById('saveBtn').style.display='';
  document.getElementById('chName').textContent=d.channel||'YouTube Channel';
  document.getElementById('chMeta').textContent=
    (d.total||videos.length)+' shorts'+(d.fetched_at?' • fetched '+new Date(d.fetched_at).toLocaleDateString():'');
  updateStats();render();
}

/* ── RENDER ── */
function getVisible(){
  const q=(document.getElementById('searchQ').value||'').toLowerCase();
  return videos.filter(v=>{
    const mq=!q||v.title.toLowerCase().includes(q);
    const mf=filter==='all'?true:filter==='done'?v.downloaded:!v.downloaded;
    return mq&&mf;
  });
}

function render(){
  const grid=document.getElementById('grid');
  const list=getVisible();
  if(!list.length){
    grid.innerHTML=`<div class="empty"><div class="ei">🔍</div><p>No videos match</p></div>`;
    return;
  }
  grid.innerHTML=list.map(v=>cardHTML(v)).join('');
}

function cardHTML(v){
  const s=dlState[v.id]||'idle';
  const dur=fmtDur(v.duration);
  const extra=s==='done'?'done':s==='going'?'going':'';
  const dotCls=s==='done'?'sd-green':s==='going'?'sd-blue':'sd-grey';
  const metaTxt=s==='done'?'Downloaded':s==='going'?'Downloading…':(v.upload_date||'Pending');

  let btn;
  if(s==='done')      btn=`<button class="dl-btn done-btn" disabled>✓ Downloaded</button>`;
  else if(s==='going') btn=`<button class="dl-btn going-btn" disabled>⏳ Downloading…</button>`;
  else                 btn=`<button class="dl-btn ready" onclick="startDownload('${v.id}',event)">⬇ Download</button>`;

  return `
<div class="card ${extra}" id="card-${v.id}">
  <div class="thumb">
    <img src="${v.thumbnail||'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'}"
         alt="${esc(v.title)}" loading="lazy"
         onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'"/>
    ${dur?`<div class="dur">${dur}</div>`:''}
    <div class="done-ov"><div class="done-badge">✓ DOWNLOADED</div></div>
    <div class="ring-wrap" id="rw-${v.id}">
      <svg class="ring" viewBox="0 0 44 44">
        <circle class="tr" cx="22" cy="22" r="20"/>
        <circle class="pr" id="rp-${v.id}" cx="22" cy="22" r="20"/>
      </svg>
      <span class="ring-pct" id="rpct-${v.id}">0%</span>
    </div>
  </div>
  <div class="cbody">
    <div class="ctitle">${esc(v.title)}</div>
    <div class="cmeta"><span class="sdot ${dotCls}"></span>${metaTxt}</div>
    ${btn}
  </div>
</div>`;
}

/* ── DOWNLOAD ── */
async function startDownload(id, e){
  if(e) e.stopPropagation();
  if(dlState[id]==='going'||dlState[id]==='done') return;
  const v=videos.find(x=>x.id===id); if(!v) return;

  dlState[id]='going'; refreshCard(id);

  let success=false;

  try{
    const resp = await fetch('/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: id, title: v.title})
    });
    
    if(resp.ok){
      const data = await resp.json();
      if(data.success){
        success = true;
      } else {
        console.error("Download failed:", data.error);
        toast("❌ Download failed - check terminal");
      }
    }
  }catch(err){ 
    console.error('Server request failed:', err);
    toast("❌ Server not running! Run 'python server.py'");
  }

  if(success){
    markDone(id);
  } else {
    dlState[id]='idle'; refreshCard(id);
  }
}

/* ── MARK DONE ── */
function markDone(id){
  dlState[id]='done';
  const v=videos.find(x=>x.id===id); if(v) v.downloaded=true;
  refreshCard(id); updateStats();
  toast('✅ '+((videos.find(x=>x.id===id)||{}).title||'Video')+' marked as downloaded!');
}

function refreshCard(id){
  const v=videos.find(x=>x.id===id); if(!v) return;
  const old=document.getElementById('card-'+id); if(!old) return;
  const tmp=document.createElement('div');
  tmp.innerHTML=cardHTML(v);
  old.replaceWith(tmp.firstElementChild);
}

/* ── BULK DOWNLOAD ── */
async function downloadAllPending(){
  const pending=videos.filter(v=>!v.downloaded&&dlState[v.id]==='idle');
  if(!pending.length){toast('No pending videos!');return;}
  toast('⬇ Starting '+pending.length+' downloads…');
  for(const v of pending){
    await startDownload(v.id,null);
    await new Promise(r=>setTimeout(r,600));
  }
}

/* ── STATS ── */
function updateStats(){
  const total=videos.length;
  const done=videos.filter(v=>v.downloaded).length;
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sDone').textContent=done;
  document.getElementById('sPend').textContent=total-done;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLbl').innerHTML=`<b>${done}</b> / ${total} downloaded &nbsp;(${pct}%)`;
}

/* ── SAVE PROGRESS ── */
function saveProgress(){
  if(!chData) return;
  chData.videos=videos; chData.fetched_at=new Date().toISOString();
  const blob=new Blob([JSON.stringify(chData,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='shorts_list.json'; a.click();
  toast('💾 Progress saved!');
}

/* ── FILTER ── */
function setF(btn,f){
  filter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}

/* ── HELPERS ── */
function fmtDur(s){
  if(!s) return ''; s=Math.round(s);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
